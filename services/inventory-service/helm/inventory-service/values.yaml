replicaCount: 2

image:
  repository: 599083837640.dkr.ecr.us-east-1.amazonaws.com/inventory-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: inventory.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

healthCheck:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 15

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
