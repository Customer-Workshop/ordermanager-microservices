name: Inventory Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'services/inventory-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/inventory-service/**'

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 599083837640.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: workshop/inventory-service
  IMAGE_TAG: ${{ github.sha }}
  SERVICE_PATH: services/inventory-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: ${{ env.SERVICE_PATH }}
        run: dotnet restore

      - name: Build
        working-directory: ${{ env.SERVICE_PATH }}
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        working-directory: ${{ env.SERVICE_PATH }}
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Angular dependencies
        working-directory: ${{ env.SERVICE_PATH }}/client-app
        run: npm ci

      - name: Build Angular app
        working-directory: ${{ env.SERVICE_PATH }}/client-app
        run: npm run build

  docker-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::599083837640:role/github-actions-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        working-directory: ${{ env.SERVICE_PATH }}
        run: |
          docker build -f docker/Dockerfile \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  argocd-sync:
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ArgoCD sync
        run: |
          echo "ArgoCD will auto-sync from the repository based on the syncPolicy configuration."
          echo "Image tag ${{ env.IMAGE_TAG }} has been pushed to ECR."
          echo "ArgoCD applications inventory-service-dev and inventory-service-staging will pick up the change."
