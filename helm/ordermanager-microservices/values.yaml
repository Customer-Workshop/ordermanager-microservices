            pathType: Prefix
    tls:
      - secretName: web-frontend-tls
        hosts:
          - web-frontend.workshop.local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nginx:
    apiGatewayUrl: "http://ordermanager-microservices-api-gateway"
  monitoring:
    enabled: true
    path: /metrics
    port: 8080
