global:
  namespace: decomposition-dev
  image:
    registry: 599083837640.dkr.ecr.us-east-1.amazonaws.com/workshop
    pullPolicy: IfNotPresent
    tag: latest
  labels:
    environment: dev
    team: ordermanager

product-service:
  replicaCount: 1
  image:
    repository: 599083837640.dkr.ecr.us-east-1.amazonaws.com/workshop/product-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts:
      - host: product-service.workshop.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: product-service-tls
        hosts:
          - product-service.workshop.local
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Production
    - name: ASPNETCORE_URLS
      value: "http://+:8080"
  monitoring:
    enabled: true
    path: /metrics
    port: 8080

