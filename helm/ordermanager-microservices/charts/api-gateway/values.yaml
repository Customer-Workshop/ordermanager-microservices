replicaCount: 1

image:
  repository: 599083837640.dkr.ecr.us-east-1.amazonaws.com/workshop/api-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: api-gateway.workshop.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-gateway-tls
      hosts:
        - api-gateway.workshop.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
  - name: ASPNETCORE_URLS
    value: "http://+:8080"

yarp:
  routes:
    products:
      clusterId: product-cluster
      match:
        path: "/api/products/{**catch-all}"
    customers:
      clusterId: customer-cluster
      match:
        path: "/api/customers/{**catch-all}"
    inventory:
      clusterId: inventory-cluster
      match:
        path: "/api/inventory/{**catch-all}"
    orders:
      clusterId: order-cluster
      match:
        path: "/api/orders/{**catch-all}"
  clusters:
    product-cluster:
      destinations:
        destination1:
          address: "http://ordermanager-microservices-product-service"
    customer-cluster:
      destinations:
        destination1:
          address: "http://ordermanager-microservices-customer-service"
    inventory-cluster:
      destinations:
        destination1:
          address: "http://ordermanager-microservices-inventory-service"
    order-cluster:
      destinations:
        destination1:
          address: "http://ordermanager-microservices-order-service"

monitoring:
  enabled: true
  path: /metrics
  port: 8080
