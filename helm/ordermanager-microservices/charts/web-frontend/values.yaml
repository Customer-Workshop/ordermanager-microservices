replicaCount: 1

image:
  repository: 599083837640.dkr.ecr.us-east-1.amazonaws.com/workshop/web-frontend
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: web-frontend.workshop.local
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: web-frontend-tls
      hosts:
        - web-frontend.workshop.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

nginx:
  apiGatewayUrl: "http://ordermanager-microservices-api-gateway"

monitoring:
  enabled: true
  path: /metrics
  port: 8080
