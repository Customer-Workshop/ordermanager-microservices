replicaCount: 1

image:
  tag: "dev-latest"

ingress:
  hosts:
    - host: inventory-dev.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: inventory-dev-tls
      hosts:
        - inventory-dev.example.com

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Development
  - name: ASPNETCORE_URLS
    value: http://+:8080

autoscaling:
  enabled: false
