apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inventory-service.fullname" . }}-config
  labels:
    {{- include "inventory-service.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ (index (default (list (dict "name" "ASPNETCORE_ENVIRONMENT" "value" "Production")) .Values.env | first).value | default "Production" | quote }}
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
