replicaCount: 2

image:
  tag: "staging-latest"

ingress:
  hosts:
    - host: inventory-staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: inventory-staging-tls
      hosts:
        - inventory-staging.example.com

env:
  - name: ASPNETCORE_ENVIRONMENT
    value: Staging
  - name: ASPNETCORE_URLS
    value: http://+:8080

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
