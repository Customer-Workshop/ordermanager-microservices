<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inventory Service</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 20px; }
    nav { background: #2c3e50; color: white; padding: 10px 20px; margin: -20px -20px 20px -20px; }
    nav h1 { display: inline; margin-right: 20px; font-size: 1.2em; }
    nav a { color: #ecf0f1; text-decoration: none; margin-right: 15px; }
    nav a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #34495e; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }
    tr.low-stock { background: #ffcccc; }
    button { background: #3498db; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
    button:hover { background: #2980b9; }
    input[type="number"] { padding: 4px; border: 1px solid #ccc; border-radius: 3px; margin-right: 5px; }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
