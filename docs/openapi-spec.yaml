openapi: 3.0.3
info:
  title: Inventory Service API
  version: v1
  description: >
    Microservice responsible for inventory management including stock levels,
    warehouse locations, restocking, deductions, and low-stock alerts.
    Decomposed from the OrderManager monolith.
  contact:
    name: Platform Team

servers:
  - url: http://localhost:5000
    description: Local development
  - url: http://localhost:8080
    description: Docker container
  - url: https://inventory-service-dev.workshop.local
    description: Kubernetes dev
  - url: https://inventory-service-staging.workshop.local
    description: Kubernetes staging

paths:
  /api/inventory:
    get:
      summary: Retrieves all inventory items
      operationId: getAllInventory
      tags: [Inventory]
      responses:
        '200':
          description: Returns the full list of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
              example:
                - id: 1
                  productId: 1
                  productName: Widget A
                  quantityOnHand: 50
                  reorderLevel: 10
                  warehouseLocation: A-01
                  lastRestocked: '2026-01-15T12:00:00Z'

  /api/inventory/product/{productId}:
    get:
      summary: Retrieves the inventory record for a specific product
      operationId: getInventoryByProduct
      tags: [Inventory]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
          description: The product identifier
      responses:
        '200':
          description: Returns the inventory item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '404':
          description: No inventory record for the given product

  /api/inventory/product/{productId}/restock:
    post:
      summary: Restocks an inventory item by adding the specified quantity
      operationId: restockProduct
      tags: [Inventory]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
          description: The product identifier to restock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestockRequest'
            example:
              quantity: 25
      responses:
        '200':
          description: Returns the updated inventory item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryItem'
        '400':
          description: No inventory record for the given product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/inventory/product/{productId}/deduct:
    post:
      summary: Deducts stock from an inventory item
      description: Called by the Order service during checkout to reserve/deduct stock.
      operationId: deductStock
      tags: [Inventory]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
          description: The product identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeductRequest'
            example:
              quantity: 5
      responses:
        '200':
          description: Stock deducted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Stock deducted successfully
        '409':
          description: Insufficient stock to fulfill the deduction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
              example:
                message: Insufficient stock for product 1

  /api/inventory/low-stock:
    get:
      summary: Retrieves all inventory items at or below their reorder level
      operationId: getLowStockItems
      tags: [Inventory]
      responses:
        '200':
          description: Returns the list of low-stock items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'

  /health:
    get:
      summary: Kubernetes health probe
      operationId: healthCheck
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: Healthy

components:
  schemas:
    InventoryItem:
      type: object
      description: Represents an inventory record tracking stock levels for a product.
      properties:
        id:
          type: integer
          description: Unique identifier for the inventory record
          example: 1
        productId:
          type: integer
          description: Foreign key referencing the product in the Product catalog
          example: 1
        productName:
          type: string
          description: Human-readable product name (denormalized)
          maxLength: 200
          example: Widget A
        quantityOnHand:
          type: integer
          description: Current quantity available in stock
          example: 50
        reorderLevel:
          type: integer
          description: Minimum stock level that triggers a reorder alert
          default: 10
          example: 10
        warehouseLocation:
          type: string
          description: Physical warehouse location code
          example: A-01
        lastRestocked:
          type: string
          format: date-time
          description: UTC timestamp of the last restock operation
          example: '2026-01-15T12:00:00Z'
      required:
        - id
        - productId
        - productName
        - quantityOnHand

    RestockRequest:
      type: object
      description: Request body for restocking an inventory item.
      properties:
        quantity:
          type: integer
          description: The quantity to add to the current stock
          minimum: 1
          example: 25
      required:
        - quantity

    DeductRequest:
      type: object
      description: Request body for deducting stock from an inventory item.
      properties:
        quantity:
          type: integer
          description: The quantity to deduct from the current stock
          minimum: 1
          example: 5
      required:
        - quantity

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
