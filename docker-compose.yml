version: "3.8"

services:
  customer-service:
    build:
      context: src/CustomerService
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    volumes:
      - customer-data:/data

  product-service:
    build:
      context: src/ProductService
      dockerfile: Dockerfile
    ports:
      - "5002:8080"
    volumes:
      - product-data:/data

  inventory-service:
    build:
      context: src/InventoryService
      dockerfile: Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ProductService__BaseUrl=http://product-service:8080
    depends_on:
      - product-service
    volumes:
      - inventory-data:/data

  order-service:
    build:
      context: src/OrderService
      dockerfile: Dockerfile
    ports:
      - "5004:8080"
    environment:
      - CustomerService__BaseUrl=http://customer-service:8080
      - ProductService__BaseUrl=http://product-service:8080
      - InventoryService__BaseUrl=http://inventory-service:8080
    depends_on:
      - customer-service
      - product-service
      - inventory-service
    volumes:
      - order-data:/data

  api-gateway:
    build:
      context: src/ApiGateway
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - customer-service
      - product-service
      - inventory-service
      - order-service

  web-frontend:
    build:
      context: src/WebFrontend
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      - api-gateway

volumes:
  customer-data:
  product-data:
  inventory-data:
  order-data:
